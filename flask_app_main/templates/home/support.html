{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Support{% endblock %}</h1>
{% endblock %}

{% block content %}
  <h2>Submit a Ticket</h2>
  <form method="post">
    <label for="subject">Subject</label>
    <input name="subject" id="subject" required>
    <label for="message">Please describe your issue</label>
    <textarea name="message" id="message" required></textarea>
    <input type="submit" value="Submit Ticket">
  </form>

  <h2>My Tickets</h2>
  {% for ticket in tickets %}
    <div>{{ ticket['subject'] }} - {{ ticket['status'] }}</div>
  {% else %}
    <p>No tickets yet.</p>
  {% endfor %}
{% endblock %}
